
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Projects</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div><h1>Projects</h1><div class="sub">Canonical project/session manager</div></div><button id="options">⚙</button></header>
<div class="tabs"><button data-tab="projects" class="active">Projects</button><button data-tab="chats">Chats</button></div>
<div class="filters">
  <button data-filter="all" class="active">All</button><button data-filter="active">Active</button>
  <button data-filter="hold">On hold</button><button data-filter="long_hold">Long hold</button><button data-filter="research">Research</button>
</div>
<input id="search" placeholder="Search…">
<div id="toolbar"><button id="newProject">+ New project</button><button id="exportBtn">Export</button><button id="importBtn">Import</button><input id="importFile" type="file" accept="application/json" hidden></div>
<div id="summary"></div><div id="list"></div>
<script src="popup.js"></script>
</body></html>
