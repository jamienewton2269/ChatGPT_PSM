<!doctype html><html><head><meta charset="utf-8"><title>Project Session Manager Settings</title>
<style>:root{color-scheme:dark}body{max-width:700px;margin:40px auto;background:#111214;color:#eee;font:14px system-ui,sans-serif;padding:0 20px}.card{background:#191b20;border:1px solid #30343a;border-radius:12px;padding:18px;margin:15px 0}label{display:block;margin:12px 0 5px}input[type=number]{width:180px;padding:7px;background:#101216;color:#eee;border:1px solid #343840;border-radius:7px}button{margin-top:18px;padding:8px 13px;border:0;border-radius:8px;background:#e5e7eb;color:#111;cursor:pointer}.hint{color:#9ca3af;font-size:12px}</style></head>
<body><h1>Project Session Manager v0.3</h1>
<div class="card"><h2>Conversation monitoring</h2><label>Warn at estimated tokens</label><input id="warnTokens" type="number" min="1000" step="1000"><label>Strong continuation warning at estimated tokens</label><input id="criticalTokens" type="number" min="2000" step="1000"><label>Warn at message count</label><input id="warnMessages" type="number" min="10" step="10"><label><input id="showFloatingStatus" type="checkbox"> Show floating session meter</label></div>
<div class="card"><h2>Live conversation follow</h2><label><input id="autoFollowLive" type="checkbox"> Keep the newest live ChatGPT output visible automatically</label><label>Manual-scroll pause threshold (pixels from bottom)</label><input id="autoFollowThresholdPx" type="number" min="50" step="10"><p class="hint">Scrolling upward deliberately pauses following. Use the floating “Resume live follow” button to jump back to the live reply.</p></div>
<div class="card"><h2>Project intelligence</h2><label><input id="projectInference" type="checkbox"> Suggest likely canonical project for unassigned chats</label><label>On-hold review after inactive days</label><input id="staleHoldDays" type="number" min="1"><label>Long-term review after inactive days</label><input id="staleLongHoldDays" type="number" min="2"><button id="save">Save</button> <span id="saved"></span></div>
<script src="options.js"></script></body></html>
